name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "hardening/**"

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            streamable_http: true
          - os: ubuntu-latest
            python-version: "3.14"
            streamable_http: false
          - os: windows-latest
            python-version: "3.14"
            streamable_http: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.7

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Run offline test suite
        if: matrix.streamable_http
        run: uv run pytest -q

      - name: Run offline test suite without redundant HTTP transport check
        if: ${{ !matrix.streamable_http }}
        run: uv run pytest -q -m "not streamable_http"

      - name: Check lint and import order
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Build wheel and source distribution
        run: uv build

      - name: Check lockfile consistency
        run: uv lock --check

  packaging:
    name: Packaging qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.7

      - name: Install Python
        run: uv python install 3.11 3.14

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups --python 3.11

      - name: Build wheel and source distribution
        run: uv build -o dist

      - name: Install and exercise built artifacts in isolated environments
        run: uv run python scripts/qualify_packaging.py --artifacts dist

  audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.7

      - name: Export locked runtime requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements.txt -o runtime-requirements.txt

      - name: Audit runtime requirements
        run: uvx --from "pip-audit>=2.7,<3" pip-audit --strict --disable-pip --require-hashes -r runtime-requirements.txt
