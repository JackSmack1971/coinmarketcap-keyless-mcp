name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "hardening/**"

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            streamable_http: true
          - os: ubuntu-latest
            python-version: "3.14"
            streamable_http: false
          - os: windows-latest
            python-version: "3.14"
            streamable_http: true

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.7

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Run offline test suite
        if: matrix.streamable_http
        run: uv run pytest -q

      - name: Run offline test suite without redundant HTTP transport check
        if: ${{ !matrix.streamable_http }}
        run: uv run pytest -q -m "not streamable_http"

      - name: Check lint and import order
        run: uv run ruff check src tests

      - name: Build wheel and source distribution
        run: uv build

      - name: Check lockfile consistency
        run: uv lock --check
