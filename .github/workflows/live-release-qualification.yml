name: Live release qualification

# Release tooling, not CI: runs the canonical keyless live verifier against an
# explicitly chosen candidate from a GitHub-hosted runner. Manual only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or ref to qualify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-release-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify live capability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUESTED_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record candidate
        id: candidate
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Requested ref: ${REQUESTED_REF}"
          echo "Resolved SHA:  ${sha}"
          git status --short
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test -n "${version}"
          echo "Package version: ${version}"
          {
            echo "sha=${sha}"
            echo "short_sha=${sha:0:12}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.7

      - name: Install Python
        run: uv python install 3.11

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups --python 3.11

      - name: CoinMarketCap connectivity preflight (diagnostic)
        # Any HTTP response proves reachability. No response is an
        # execution-environment failure, never evidence that a route is unsupported.
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 \
            https://pro-api.coinmarketcap.com/public-api/v1/global-metrics/quotes/latest || true)"
          echo "Preflight HTTP status: ${code:-none}"
          if [ -z "${code}" ] || [ "${code}" = "000" ]; then
            echo "::error::Runner cannot reach pro-api.coinmarketcap.com (network/environment failure, not a capability result)."
            exit 1
          fi

      - name: Snapshot existing evidence
        run: ls verification/live-capability-*.json 2>/dev/null | sort > "${RUNNER_TEMP}/evidence-before.txt" || true

      - name: Run canonical live verifier
        run: uv run python -m coinmarketcap_keyless_mcp.verify_live

      - name: Locate evidence generated by this run
        id: evidence
        if: always()
        run: |
          ls verification/live-capability-*.json 2>/dev/null | sort > "${RUNNER_TEMP}/evidence-after.txt" || true
          comm -13 "${RUNNER_TEMP}/evidence-before.txt" "${RUNNER_TEMP}/evidence-after.txt" > "${RUNNER_TEMP}/evidence-new.txt"
          count="$(wc -l < "${RUNNER_TEMP}/evidence-new.txt")"
          echo "New evidence files: ${count}"
          cat "${RUNNER_TEMP}/evidence-new.txt"
          if [ "${count}" -ne 1 ]; then
            echo "::error::Expected exactly one evidence file from this run, found ${count}."
            exit 1
          fi
          echo "path=$(cat "${RUNNER_TEMP}/evidence-new.txt")" >> "${GITHUB_OUTPUT}"

      - name: Validate evidence
        if: success()
        env:
          EVIDENCE: ${{ steps.evidence.outputs.path }}
          EXPECTED_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          uv run python - <<'PY'
          import json
          import os

          from coinmarketcap_keyless_mcp.contracts import BASE_URL, ROUTES

          path = os.environ["EVIDENCE"]
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          problems = []
          if BASE_URL != "https://pro-api.coinmarketcap.com/public-api":
              problems.append(f"unexpected contract base URL {BASE_URL!r}")
          if report.get("base_url") != BASE_URL:
              problems.append(f"base_url is {report.get('base_url')!r}")
          if report.get("server_version") != os.environ["EXPECTED_VERSION"]:
              problems.append(
                  f"server_version {report.get('server_version')!r} != "
                  f"candidate {os.environ['EXPECTED_VERSION']!r}"
              )
          routes = report.get("routes", [])
          seen = {(entry.get("tool"), entry.get("route")) for entry in routes}
          if len(routes) != 13 or seen != set(ROUTES.items()):
              problems.append(f"expected the 13 released routes, got {len(routes)}")
          counts = {}
          for entry in routes:
              counts[entry.get("classification")] = counts.get(entry.get("classification"), 0) + 1
          if counts != {"SUPPORTED": 13}:
              problems.append(f"classification counts {counts}")
          text = json.dumps(report).lower()
          for marker in ("api_key", "api-key", "x-cmc_pro_api_key", "authorization", "bearer", "credential"):
              if marker in text:
                  problems.append(f"credential marker {marker!r} present")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              raise SystemExit(1)
          print(f"Evidence valid: {path}; SUPPORTED=13; version {report['server_version']}")
          PY

      - name: Upload evidence
        if: always() && steps.evidence.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-capability-${{ steps.candidate.outputs.short_sha }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        if: success()
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.candidate.outputs.version }}
          EVIDENCE: ${{ steps.evidence.outputs.path }}
          ARTIFACT: live-capability-${{ steps.candidate.outputs.short_sha }}
        run: |
          {
            echo "## Live release qualification passed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Requested ref | \`${REQUESTED_REF}\` |"
            echo "| Resolved SHA | \`${SHA}\` |"
            echo "| Package version | \`${VERSION}\` |"
            echo "| Verifier exit | 0 |"
            echo "| Result | \`SUPPORTED=13\` |"
            echo "| Evidence | \`${EVIDENCE}\` (artifact \`${ARTIFACT}\`) |"
            echo ""
            echo "No credentials, secrets or API keys were used."
          } >> "${GITHUB_STEP_SUMMARY}"
