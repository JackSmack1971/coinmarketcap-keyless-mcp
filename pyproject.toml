[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coinmarketcap-keyless-mcp"
version = "1.0.0"
description = "Bounded, read-only MCP contracts for selected CoinMarketCap public routes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
]

[project.scripts]
coinmarketcap-keyless-mcp = "coinmarketcap_keyless_mcp.runtime:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coinmarketcap_keyless_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["streamable_http: tests that start the local Streamable HTTP transport"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
